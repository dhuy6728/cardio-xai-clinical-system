    // --- CARDIOVASCULAR AI PREDICTION ALGORITHM ---
    function calculateCardioRisk(params) {
      // params: { age, gender, height, weight, ap_hi, ap_lo, chol, gluc, smoke, alco, active }
      const bmi = params.weight / Math.pow(params.height / 100, 2);
      
      let z = -5.15; // base log-odds
      z += (params.age - 30) * 0.056;
      
      if (params.ap_hi > 140) {
        z += (params.ap_hi - 120) * 0.036 + 0.35;
      } else if (params.ap_hi > 120) {
        z += (params.ap_hi - 120) * 0.024;
      } else {
        z += (params.ap_hi - 120) * 0.015;
      }

      if (params.ap_lo > 90) {
        z += (params.ap_lo - 80) * 0.022;
      } else {
        z += (params.ap_lo - 80) * 0.01;
      }

      if (params.chol === 1) z -= 0.25;
      else if (params.chol === 2) z += 0.55;
      else if (params.chol === 3) z += 1.35;

      if (params.gluc === 1) z -= 0.10;
      else if (params.gluc === 2) z += 0.30;
      else if (params.gluc === 3) z += 0.75;

      if (bmi > 25) {
        z += (bmi - 22) * 0.065;
      } else {
        z += (bmi - 22) * 0.02;
      }

      if (params.smoke === 1) z += 0.45;
      if (params.alco === 1) z += 0.15;
      if (params.active === 1) z -= 0.40;
      if (params.gender === 2) z += 0.18; // Nam giới có xu hướng nguy cơ sớm hơn

      const prob = 1 / (1 + Math.exp(-z));
      const clampedProb = Math.min(Math.max(prob, 0.02), 0.98);

      let level = "NGUY CƠ THẤP";
      let color = "#16A34A";
      let badge = "badge-low";
      let advice = "";

      if (clampedProb >= 0.65) {
        level = "NGUY CƠ CAO";
        color = "#DC2626";
        badge = "badge-high";
        advice = "Nguy cơ tim mạch đang ở mức cao. Các chỉ số cho thấy thành mạch máu và tim đang chịu áp lực lớn. Hãy đến khám chuyên khoa tim mạch sớm nhất để được đo điện tim (ECG), siêu âm tim và lập phác đồ kiểm soát.";
      } else if (clampedProb >= 0.35) {
        level = "NGUY CƠ TRUNG BÌNH";
        color = "#D97706";
        badge = "badge-mod";
        advice = "Bạn đang có các yếu tố nguy cơ tim mạch tiềm ẩn. Cần đo huyết áp định kỳ tại nhà 2 lần/tuần, giảm muối ăn, kiểm soát cân nặng và tập thể thao đều đặn 150 phút/tuần.";
      } else {
        level = "NGUY CƠ THẤP (AN TOÀN)";
        color = "#16A34A";
        badge = "badge-low";
        advice = "Chúc mừng bạn! Trái tim của bạn hiện đang có các chỉ số nằm trong vùng bảo vệ an toàn. Tiếp tục duy trì chế độ dinh dưỡng lành mạnh, vận động thể chất thường xuyên và khám định kỳ hàng năm.";
      }

      // XAI Factor contributions
      const factors = [
        { name: "Huyết áp tâm thu (" + params.ap_hi + " mmHg)", impact: params.ap_hi > 130 ? (params.ap_hi - 120) * 0.4 : -8, positive: params.ap_hi > 120 },
        { name: "Mức Cholesterol (" + (params.chol === 1 ? 'Bình thường' : params.chol === 2 ? 'Hơi cao' : 'Rất cao') + ")", impact: params.chol === 3 ? 24 : params.chol === 2 ? 12 : -10, positive: params.chol > 1 },
        { name: "Độ tuổi (" + params.age + " tuổi)", impact: (params.age - 35) * 0.5, positive: params.age > 45 },
        { name: "Chỉ số Thể trạng BMI (" + bmi.toFixed(1) + " kg/m²)", impact: (bmi - 22) * 1.2, positive: bmi > 24 },
        { name: "Thuốc lá (" + (params.smoke === 1 ? 'Có hút' : 'Không hút') + ")", impact: params.smoke === 1 ? 18 : -5, positive: params.smoke === 1 },
        { name: "Vận động thể lực (" + (params.active === 1 ? 'Đều đặn' : 'Ít vận động') + ")", impact: params.active === 1 ? -15 : 12, positive: params.active === 0 }
      ];

      return {
        prob: clampedProb,
        level: level,
        color: color,
        badge: badge,
        bmi: parseFloat(bmi.toFixed(2)),
        advice: advice,
        factors: factors
      };
    }

    function updatePatientBMI() {
      const h = parseFloat(document.getElementById('p-height')?.value || 165);
      const w = parseFloat(document.getElementById('p-weight')?.value || 68);
      const bmi = (w / Math.pow(h / 100, 2)).toFixed(2);
      const display = document.getElementById('p-bmi-display');
      if (display) {
        let label = "Bình thường";
        if (bmi < 18.5) label = "Thiếu cân";
        else if (bmi >= 25.0) label = "Béo phì";
        else if (bmi >= 23.0) label = "Thừa cân nhẹ";
        display.innerText = `${bmi} kg/m² (${label})`;
      }
    }

            </div>

            <div class="pt-3 border-t border-slate-100 flex gap-2">
              <button onclick="runDoctorAnalysis()" class="flex-1 py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm shadow transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-chart-line"></i> Phân Tích XAI
              </button>
              <button onclick="saveDoctorCase()" class="px-4 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm shadow transition flex items-center gap-1" title="Lưu vào Kho Lưu Trữ">
                <i class="fa-solid fa-floppy-disk"></i> Lưu Hồ Sơ
              </button>
            </div>
          </div>

          <!-- Doctor XAI Analytics Output -->
          <div class="lg:col-span-7 space-y-6">
            <!-- Metric Cards -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="doc-metrics-grid">
              <!-- Rendered via runDoctorAnalysis -->
            </div>

            <!-- XAI Explainability Waterfall Breakdown -->
            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
              <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                  <i class="fa-solid fa-brain text-purple-600"></i> Phân Tích Đóng Góp Yếu Tố (Explainable AI - XAI)
                </h3>
                <span class="text-xs bg-purple-50 text-purple-700 px-2.5 py-1 rounded-full font-semibold">Tác động cận biên</span>
              </div>
              <div id="doc-xai-factors" class="space-y-3">
                <!-- Rendered dynamically -->
              </div>
            </div>

            <!-- Clinical Protocol & Recommendation -->
            <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm" id="doc-protocol-box">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </div>
      `;
      runDoctorAnalysis();
    }

    function loadPresetCase() {
      const preset = document.getElementById('doc-preset').value;
      if (preset === 'case1') {
        document.getElementById('doc-name').value = 'Trần Văn Cao';
        document.getElementById('doc-age').value = '51';
        document.getElementById('doc-gender').value = '2';
        document.getElementById('doc-height').value = '168';
        document.getElementById('doc-weight').value = '90';
        document.getElementById('doc-ap-hi').value = '145';
        document.getElementById('doc-ap-lo').value = '95';
        document.getElementById('doc-chol').value = '3';
        document.getElementById('doc-gluc').value = '2';
        document.getElementById('doc-smoke').checked = true;
        document.getElementById('doc-alco').checked = false;
        document.getElementById('doc-active').checked = false;
      } else if (preset === 'case2') {
        document.getElementById('doc-name').value = 'Lê Thị Thảo';
        document.getElementById('doc-age').value = '32';
        document.getElementById('doc-gender').value = '1';
        document.getElementById('doc-height').value = '165';
        document.getElementById('doc-weight').value = '61';
        document.getElementById('doc-ap-hi').value = '118';
        document.getElementById('doc-ap-lo').value = '76';
        document.getElementById('doc-chol').value = '1';
        document.getElementById('doc-gluc').value = '1';
        document.getElementById('doc-smoke').checked = false;
        document.getElementById('doc-alco').checked = false;
        document.getElementById('doc-active').checked = true;
      }
      runDoctorAnalysis();
    }

    function runDoctorAnalysis() {
      const name = document.getElementById('doc-name')?.value || "Bệnh nhân";
      const params = {
        age: parseInt(document.getElementById('doc-age')?.value || 50),
        gender: parseInt(document.getElementById('doc-gender')?.value || 2),
        height: parseFloat(document.getElementById('doc-height')?.value || 165),
        weight: parseFloat(document.getElementById('doc-weight')?.value || 72),
        ap_hi: parseInt(document.getElementById('doc-ap-hi')?.value || 135),
        ap_lo: parseInt(document.getElementById('doc-ap-lo')?.value || 88),
        chol: parseInt(document.getElementById('doc-chol')?.value || 2),
        gluc: parseInt(document.getElementById('doc-gluc')?.value || 1),
        smoke: document.getElementById('doc-smoke')?.checked ? 1 : 0,
        alco: document.getElementById('doc-alco')?.checked ? 1 : 0,
        active: document.getElementById('doc-active')?.checked ? 1 : 0
      };

      const res = calculateCardioRisk(params);

      // Render 4 metrics
      const grid = document.getElementById('doc-metrics-grid');
      if (grid) {
        grid.innerHTML = `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <span class="text-[11px] font-bold uppercase text-slate-400">Xác Suất Tim Mạch</span>
            <div class="text-2xl font-extrabold mt-1" style="color: ${res.color};">${(res.prob * 100).toFixed(1)}%</div>
            <span class="text-[11px] text-slate-400">Mô hình Gradient Boost</span>
          </div>
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <span class="text-[11px] font-bold uppercase text-slate-400">Phân Tầng Rủi Ro</span>
            <div class="text-base font-extrabold mt-1">
              <span class="px-2 py-0.5 rounded text-xs font-bold ${res.badge}">${res.level}</span>
            </div>
            <span class="text-[11px] text-slate-400">Tiêu chuẩn ESC/ACC</span>
          </div>
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <span class="text-[11px] font-bold uppercase text-slate-400">Chỉ Số BMI</span>
            <div class="text-2xl font-extrabold text-slate-800 mt-1">${res.bmi} <span class="text-xs font-normal text-slate-400">kg/m²</span></div>
            <span class="text-[11px] text-slate-400">${res.bmi >= 25 ? 'Béo phì' : res.bmi >= 23 ? 'Thừa cân' : 'Bình thường'}</span>
          </div>
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <span class="text-[11px] font-bold uppercase text-slate-400">Huyết Áp Khám</span>
            <div class="text-2xl font-extrabold text-slate-800 mt-1">${params.ap_hi}/${params.ap_lo}</div>
            <span class="text-[11px] ${params.ap_hi >= 140 ? 'text-red-600 font-bold' : 'text-slate-400'}">${params.ap_hi >= 140 ? 'HA giai đoạn 2' : 'HA tối ưu'}</span>
          </div>
        `;
      }

      // Render XAI factor breakdown
      const xaiBox = document.getElementById('doc-xai-factors');
      if (xaiBox) {
        xaiBox.innerHTML = res.factors.map(f => {
          const isBad = f.positive && f.impact > 0;
          const barColor = isBad ? 'bg-red-500' : 'bg-emerald-500';
          const textColor = isBad ? 'text-red-700' : 'text-emerald-700';
          const sign = f.impact > 0 ? '+' : '';
          const absVal = Math.min(Math.abs(f.impact) * 3, 100);
          return `
            <div>
              <div class="flex justify-between text-xs font-semibold mb-1">
                <span class="text-slate-700">${f.name}</span>
                <span class="${textColor}">${sign}${f.impact.toFixed(1)}% rủi ro</span>
              </div>
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full ${barColor} rounded-full" style="width: ${absVal}%;"></div>
              </div>
            </div>
          `;
        }).join('');
      }

      // Render Protocol box
      const protBox = document.getElementById('doc-protocol-box');
      if (protBox) {
        protBox.innerHTML = `
          <h3 class="text-base font-bold text-slate-900 flex items-center gap-2 mb-2">
            <i class="fa-solid fa-clipboard-check text-sky-600"></i> Khuyến Nghị & Phác Đồ Lâm Sàng Đề Xuất
          </h3>
          <p class="text-sm text-slate-600 mb-3 leading-relaxed">
            ${res.prob >= 0.65 ? 
              `Bệnh nhân <b>${name}</b> có nguy cơ tim mạch cao (${(res.prob * 100).toFixed(1)}%). Đề nghị bác sĩ chỉ định Điện tâm đồ (ECG), siêu âm tim Doppler màu, xét nghiệm bộ mỡ máu chuyên sâu (LDL-C, Triglyceride) và cân nhắc khởi trị thuốc hạ áp phối hợp.` :
              res.prob >= 0.35 ?
              `Bệnh nhân <b>${name}</b> có nguy cơ trung bình (${(res.prob * 100).toFixed(1)}%). Khuyến nghị theo dõi huyết áp lưu động 24h (Holter HA), tư vấn chế độ ăn giảm muối và tái khám sau 3 tháng.` :
              `Bệnh nhân <b>${name}</b> có các chỉ số hiện tại trong ngưỡng an toàn (${(res.prob * 100).toFixed(1)}%). Hướng dẫn duy trì rèn luyện thể thao và kiểm tra sức khỏe định kỳ hàng năm.`
            }
          </p>
          <div class="text-xs text-slate-400 border-t pt-2 flex items-center justify-between">
            <span>Tiêu chuẩn khuyến cáo: <b>VNHA / ESC Guidelines 2024</b></span>
            <span>Mã hồ sơ: <b>#CXA-${Math.floor(res.prob * 9999)}</b></span>
          </div>
        `;
      }
    }

    function saveDoctorCase() {
      const name = document.getElementById('doc-name').value || "Bệnh nhân ẩn danh";
      const params = {
        age: parseInt(document.getElementById('doc-age').value),
        gender: parseInt(document.getElementById('doc-gender').value),
        height: parseFloat(document.getElementById('doc-height').value),
        weight: parseFloat(document.getElementById('doc-weight').value),
        ap_hi: parseInt(document.getElementById('doc-ap_hi').value),
        ap_lo: parseInt(document.getElementById('doc-ap_lo').value),
        chol: parseInt(document.getElementById('doc-chol').value),
        gluc: parseInt(document.getElementById('doc-gluc').value),
        smoke: document.getElementById('doc-smoke').checked ? 1 : 0,
        alco: document.getElementById('doc-alco').checked ? 1 : 0,
        active: document.getElementById('doc-active').checked ? 1 : 0
      };

      const res = calculateCardioRisk(params);
      const now = new Date();
      const dateFormatted = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      saveRepoRecord({
        roleType: 'doctor',
        patientName: name,
        date: dateFormatted,
        riskProb: res.prob,
        riskLevel: res.level,
        bp: `${params.ap_hi}/${params.ap_lo}`,
        bmi: res.bmi,
        chol: params.chol,
        gluc: params.gluc,
        recommendation: `Bác sĩ ghi nhận ca khám ${name}: ${res.level} (${(res.prob * 100).toFixed(1)}%). ${res.advice}`
      });

      alert(`✅ Đã lưu hồ sơ bệnh nhân "${name}" vào Kho Lưu Trữ thành công!`);
    }

    // 7. DOCTOR KHO LƯU TRỮ (SAVED WITH PATIENT NAME)
    function renderDoctorHistory(root) {
      const records = getRepoRecords();
      root.innerHTML = `
        <div class="max-w-6xl mx-auto">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-6 mb-6 border-b border-slate-200">
            <div>
              <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-folder-tree text-sky-600"></i> Kho Lưu Trữ Bệnh Án (Dành Cho Bác Sĩ)
              </h1>
              <p class="text-sm text-slate-500 mt-1">
                Quản lý và tra cứu hồ sơ bệnh án theo <b>Tên Bệnh Nhân</b>, ngày khám và phân tầng rủi ro.
              </p>
            </div>
            <div class="mt-4 sm:mt-0 flex gap-2">
              <button onclick="switchNav('doctor-diagnose')" class="px-4 py-2 rounded-xl bg-sky-600 text-white font-semibold text-sm shadow hover:bg-sky-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Khám Ca Mới
              </button>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                    <th class="py-3 px-4">Tên Bệnh Nhân</th>
                    <th class="py-3 px-4">Ngày Khám</th>
                    <th class="py-3 px-4">Phân Tầng Rủi Ro</th>
                    <th class="py-3 px-4">Huyết Áp</th>
                    <th class="py-3 px-4">BMI</th>
                    <th class="py-3 px-4">Khuyến Nghị Điều Trị</th>
                    <th class="py-3 px-4 text-center">Thao tác</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${records.map(r => {
                    const isHigh = r.riskProb >= 0.65 || (r.riskLevel && r.riskLevel.includes('CAO'));
                    const isMod = !isHigh && (r.riskProb >= 0.35 || (r.riskLevel && r.riskLevel.includes('TRUNG')));
                    const badge = isHigh ? 'badge-high' : isMod ? 'badge-mod' : 'badge-low';
                    return `
                      <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3 px-4 font-bold text-slate-900">
                          <i class="fa-solid fa-user-circle text-slate-400 mr-1.5"></i> ${r.patientName || 'Bệnh nhân'}
                        </td>
                        <td class="py-3 px-4 text-xs text-slate-500">${r.date}</td>
                        <td class="py-3 px-4">
                          <span class="px-2.5 py-1 rounded-full text-xs font-bold ${badge}">
                            ${r.riskLevel} (${(r.riskProb * 100).toFixed(1)}%)
                          </span>
                        </td>
                        <td class="py-3 px-4 font-semibold text-slate-800">${r.bp}</td>
                        <td class="py-3 px-4 font-semibold text-slate-800">${r.bmi}</td>
                        <td class="py-3 px-4 text-xs text-slate-600 max-w-xs truncate" title="${r.recommendation}">
                          ${r.recommendation}
                        </td>
                        <td class="py-3 px-4 text-center">
                          <button onclick="deleteRepoRecord(${r.id})" class="text-slate-300 hover:text-red-500 transition p-1" title="Xóa hồ sơ">
                            <i class="fa-solid fa-trash-can"></i>
                          </button>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // --- ARTICLE MODAL CONTROLLERS ---
    function openArticleModal(id) {
      const art = ARTICLES.find(a => a.id === id);
      if (!art) return;
      const modal = document.getElementById('article-modal');
      const container = document.getElementById('modal-article-content');
      container.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${art.badgeColor}">${art.category}</span>
          <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${art.readTime}</span>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-3">${art.title}</h2>
        <div class="text-xs text-slate-500 mb-6 pb-4 border-b border-slate-100 flex items-center justify-between">
          <span><i class="fa-solid fa-user-doctor mr-1.5 text-sky-600"></i><b>Tác giả:</b> ${art.author}</span>
          <span><b>Ngày đăng:</b> ${art.date}</span>
        </div>
        <div class="bg-sky-50 rounded-xl p-4 mb-6 border border-sky-100">
          <h4 class="font-bold text-xs uppercase tracking-wider text-sky-800 mb-2">Điểm Cốt Lõi Cần Nhớ:</h4>
          <ul class="text-xs space-y-1.5 text-slate-700 pl-4 list-disc">
            ${art.takeaways.map(t => `<li>${t}</li>`).join('')}
          </ul>
        </div>
        <div class="text-sm leading-relaxed text-slate-700 space-y-4">
          ${art.content}
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function closeArticleModal() {
      document.getElementById('article-modal').classList.add('hidden');
    }

    // --- INITIALIZE APPLICATION ---
    window.addEventListener('DOMContentLoaded', () => {
      setRole('patient');
    });
  </script>
</body>
</html>
