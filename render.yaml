services:
  # 1. CardioXAI Web Dashboard (Streamlit)
  - type: web
    name: cardioxai-dashboard
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    plan: free
    autoDeploy: true

  # 2. CardioXAI RESTful API (FastAPI)
  - type: web
    name: cardioxai-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
